# TruthLens X — edge reverse proxy (M1 foundation)
#
# This is the ONLY component that publishes ports. Everything else lives on the internal compose
# network (DEPLOYMENT_GUIDE, port-exposure rule).
#
# Two deliberate choices worth stating:
#
# 1. HEADERS ARE SET ONCE, AT THE EDGE. The API already emits X-Content-Type-Options, X-Frame-Options
#    and the Cross-Origin-* headers (app/core/middleware.py). nginx hides the proxied copies before
#    setting its own, because otherwise the client receives each header twice — and a doubled
#    X-Frame-Options or CSP is ambiguous enough that some browsers resolve it in the least safe way.
#
# 2. THE API IS NEVER SERVED STATICALLY FROM DISK. There is no `root` or `alias` anywhere in this
#    file pointing at the evidence tree. Serving evidence through nginx would bypass authentication,
#    the capability check and the HMAC-signed download URL entirely — see ADR-0004 and the
#    NGINX_DOC_ROOT / EVIDENCE_MOUNT_POINT disjointness check in app/core/config.py.

# ── HTTP: health endpoint plus a redirect to TLS in production ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Used by the nginx container healthcheck. Deliberately not proxied: it must answer even when
    # the API is down, so that "nginx is broken" and "the API is broken" stay distinguishable.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Must be >= the API's MAX_UPLOAD_BYTES (4 GiB by default). If nginx's cap is lower, large
    # evidence uploads fail with 413 before the application ever sees them — the DEPLOYMENT_GUIDE
    # troubleshooting table lists exactly this mismatch.
    client_max_body_size 4096m;

    # Evidence uploads are large and may be slow; do not cut them off at nginx's defaults.
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Drop the proxied copies before setting the edge values (see note 1).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cache-Control;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), bluetooth=()" always;
    # Case data must never be cached in a browser or a shared intermediary.
    add_header Cache-Control "no-store" always;

    # Hide the version string; it is free reconnaissance.
    server_tokens off;

    # The proxy sets X-Request-ID if the client did not, so every request is traceable even when the
    # caller forgot. The API validates and echoes it (app/core/middleware.py).
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API first, so /api/... never falls through to the frontend.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
    }

    # Health and readiness are proxied too: they are how an operator checks the stack without
    # publishing a port (DEPLOYMENT_GUIDE).
    location = /healthz {
        proxy_pass http://api:8000;
    }
    location = /readyz {
        proxy_pass http://api:8000;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        # Next.js hot reload uses a websocket upgrade in development.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
# ENABLE THIS FOR ANY REAL DEPLOYMENT. It is commented out, rather than shipped half-configured,
# because a `listen 443 ssl` block with missing certificate paths makes nginx refuse to start —
# which would leave the whole stack down for an operator who never intended to enable TLS yet.
#
# To enable:
#   1. Put the certificate and key on the host OUTSIDE the repository and outside the evidence
#      volume (e.g. /etc/truthlens/tls/).
#   2. Mount them read-only into the nginx service only.
#   3. Uncomment the block below and change the port-80 server to a 301 redirect to https.
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name truthlens.example.internal;
#
#     ssl_certificate     /etc/truthlens/tls/fullchain.pem;
#     ssl_certificate_key /etc/truthlens/tls/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache   shared:TLS:10m;
#     ssl_session_timeout 1h;
#
#     ... same header and location blocks as the port-80 server above ...
# }
