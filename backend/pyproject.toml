[project]
name = "truthlens-backend"
version = "0.1.0"
description = "TruthLens X — AI-powered digital forensics and evidence intelligence platform (backend API)"
readme = "../README.md"
requires-python = ">=3.11,<3.13"

# The repository is deliberately UNLICENSED (docs/adr/ADR-0008). No licence classifier is
# declared here, because doing so would imply a grant that has not been made.
authors = [{ name = "TruthLens X" }]

# ── Default dependency set: permissive or file-level copyleft ONLY ────────────
# ADR-0001. Nothing below is AGPL, SSPL or RSAL. Copyleft components (ultralytics,
# PyMuPDF, poppler, ClamAV) live in optional extras and behind ENABLE_* flags that all
# default to false. Model weights are audited SEPARATELY from these packages — a
# permissive package does not make its weights permissive. See
# docs/THIRD_PARTY_LICENSE_AUDIT.md.
dependencies = [
    "fastapi==0.162.3",           # MIT
    "pydantic==2.14.3",           # MIT
    "pydantic-settings==2.16.2",  # MIT
    "uvicorn==0.40.0",            # BSD-3
    "structlog==25.5.0",          # MIT/Apache-2.0 — structured logging + redaction
]

[project.optional-dependencies]
# Database extra. Kept separate so the API can be imported and its configuration validated
# in environments without a driver installed (CI unit tests, linting, docs builds).
db = [
    "sqlalchemy==2.1.8",          # MIT
    "alembic==1.20.1",            # MIT
    # psycopg 3 is LGPL-3.0 WITH AN EXPLICIT LINKING PERMISSION (the same model as libpq,
    # which every PostgreSQL client uses), so no copyleft reaches platform code. If counsel
    # objects to any LGPL in the graph, asyncpg (Apache-2.0) is the documented drop-in.
    # See docs/THIRD_PARTY_LICENSE_AUDIT.md §4.2 — this substitution is recorded, not silent.
    "psycopg[binary]==3.2.13",
]

dev = [
    "pytest==9.2.0",              # MIT
    "pytest-asyncio==1.3.0",      # Apache-2.0
    "pytest-cov==7.0.0",          # MIT
    "ruff==0.14.10",              # MIT — lint AND format
    "mypy==1.19.1",               # MIT
    "httpx==0.28.1",              # BSD-3 — used by the gated-egress test harness
    # starlette >= 1.0 requires httpx2 for TestClient and emits a deprecation warning for
    # plain httpx, which our `filterwarnings = error` setting turns into a failure. BSD-3,
    # same lineage as httpx. Recorded in docs/THIRD_PARTY_LICENSE_AUDIT.md §4.
    "httpx2==2.16.0",             # BSD-3
    "types-Pygments==2.19.0.20250809",
]

# ── Copyleft extras. NEVER installed by default. NEVER activated by default. ──
# ADR-0001 requirement 6. Each requires an explicit ENABLE_* flag AND an accepted
# licensing obligation. Installing one of these extras is an audited operator action.
agpl = [
    "ultralytics==8.4.208",       # AGPL-3.0 — ENABLE_ULTRALYTICS
    "pymupdf==1.26.7",            # AGPL-3.0 / Artifex commercial — ENABLE_AGPL_PYMuPDF
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ══════════════════════════════════════════════════════════════════════════════
# Ruff — lint and format in one tool
# ══════════════════════════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "migrations"]
extend-exclude = [".venv-m1", "migrations/versions"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# Keep the standard library / third-party / first-party grouping the project already follows.
combine-as-imports = true

[tool.ruff.lint]
# Rule families, each chosen for a specific failure mode this project must not have:
#   E/W  pycodestyle           F  pyflakes          I  isort
#   B    bugbear (mutable defaults, late binding)   C4 comprehensions
#   UP   pyupgrade            S  bandit (SECURITY — non-negotiable here)
#   ASYNC blocking calls in async code (would stall the event loop under load)
#   RUF  ruff-specific        SIM simplification   TID flake8-tidy-imports
#   PT   pytest style         N  pep8-naming       PL pylint subset
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ASYNC", "RUF", "SIM", "TID", "PT", "N", "PL"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "PLR0913", # FastAPI handlers legitimately take many injected parameters
    "S101",    # assert is the correct idiom inside tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert is the point of a test
    "S105",   # hardcoded test secrets are deliberate fixtures, never real credentials
    "S106",
    "PLR2004",# magic numbers are readable in assertions
    "SLF001", # tests reach into internals on purpose
]
"migrations/**" = ["S608"]  # Alembic op.execute with literal SQL is the intended usage

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Each ban closes a specific forensic-integrity or security hole.
"os.system".msg = "Shell injection and no argument control. Use subprocess.run with an argument vector and shell=False (ADR-0003 requires this for ExifTool)."
"os.popen".msg = "Shell injection. Use subprocess.run with an argument vector."
"subprocess.call".msg = "Use subprocess.run and check the return code explicitly."
"pickle.loads".msg = "Arbitrary code execution on attacker-controlled evidence. Never unpickle untrusted data."
"pickle.load".msg = "Arbitrary code execution on attacker-controlled evidence. Never unpickle untrusted data."
"yaml.load".msg = "Use yaml.safe_load — yaml.load can instantiate arbitrary Python objects."
"random.random".msg = "Not cryptographically secure. Use the `secrets` module for anything security-relevant (ids, tokens, salts)."
"random.choice".msg = "Not cryptographically secure. Use the `secrets` module."
"hashlib.md5".msg = "Collision-broken. Evidence integrity uses SHA-256 exclusively (ADR-0011, content-addressed store)."
"hashlib.sha1".msg = "Collision-broken. Evidence integrity uses SHA-256 exclusively."
"requests.get".msg = "Use the audited egress client; outbound calls must pass through the master-switch check (ADR-0012)."
"httpx.get".msg = "Use the audited egress client; outbound calls must pass through the master-switch check (ADR-0012)."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ══════════════════════════════════════════════════════════════════════════════
# mypy — strict, because a type error in an integrity check is a data-integrity bug
# ══════════════════════════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
exclude = ["\\.venv.*", "migrations/versions"]

[[tool.mypy.overrides]]
module = ["celery.*", "magic.*", "reportlab.*", "cv2.*", "easyocr.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ══════════════════════════════════════════════════════════════════════════════
# pytest
# ══════════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a live PostgreSQL or Redis (skipped without one)",
    "contract: validates the committed OpenAPI baseline against the app",
    "security: asserts a ratified security or licensing control (ADR-backed)",
    "slow: long-running; excluded from the default CI pass",
]
# A warning is a defect in this project, not noise. Specific third-party deprecations that
# we cannot act on are ignored individually, with the reason recorded inline.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::PendingDeprecationWarning:starlette.*",
]

# ══════════════════════════════════════════════════════════════════════════════
# coverage — 80% floor on new code (MASTER_PRD §4, TESTING_STRATEGY §3)
# ══════════════════════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__init__.py", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "def __repr__",
]

[tool.coverage.html]
directory = "../htmlcov"
