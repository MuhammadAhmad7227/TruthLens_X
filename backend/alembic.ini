# Alembic configuration — schema migrations are the only path to a schema change.
#
# DATABASE_DESIGN.md §1 principle DB-7: no manual DDL, ever. The database is built by
# `alembic upgrade head` and by nothing else, so that what is running in production is
# reconstructible from this repository.
#
# There is deliberately NO `sqlalchemy.url` here. The connection string is resolved by
# migrations/env.py from the application's own Pydantic Settings (`DATABASE_URL`), because a URL in
# this file would be a second configuration system that could disagree with the one the application
# uses — and a migration that runs against a different database than the API connects to is the
# worst possible kind of surprise. See migrations/README.md for how to run migrations as the
# `tlx_migrator` role rather than as `tlx_app`.

[alembic]
# %(here)s makes the path relative to THIS file rather than to the working directory, so
# `alembic upgrade head` behaves the same from backend/, from the repository root and from inside a
# container whose WORKDIR is neither.
script_location = %(here)s/migrations

# Revisions are named `<sequence>_<slug>` and the sequence is part of the file name, so the order of
# migrations is visible in a directory listing without running `alembic history`.
file_template = %%(rev)s_%%(slug)s

# Never truncate a revision id: a truncated slug in a file name is a different revision id in the
# database, and the mismatch is invisible until a downgrade fails.
truncate_slug_length = 40

# UTC, because §1 principle DB-6 requires every timestamp in this project to be UTC — including the
# ones Alembic writes into a generated revision header.
timezone = UTC

# `revision --autogenerate` should be able to import the application's models. env.py does that
# explicitly, so this stays false: an env-var-driven import path is one more way for a developer's
# shell and CI to disagree.
version_path_separator = os

# ── Logging ──────────────────────────────────────────────────────────────────────────────────────
# Kept minimal and separate from the application's structlog configuration on purpose: migrations run
# as a deploy step, often with no API process alive, and a migration that could not configure
# logging must still be able to run.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
