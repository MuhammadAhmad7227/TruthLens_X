name: temporary-format-debug
on:
  push:
    branches:
      - codex/m8-metadata-extraction
jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.10
      - run: ruff format --diff app tests
