name: formatter-helper
on:
  push:
    branches:
      - codex/all-milestones-build
  workflow_dispatch:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "backend[dev,db]"
      - run: |
          cd backend
          ruff check . --fix
          ruff format .
      - name: Emit diff
        run: git diff --no-color
