name: ci-backend

# Runs on every push and pull request. The steps below are the same commands documented in
# backend/README.md, so a contributor can reproduce a CI failure locally without guessing.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # `[db]` is not optional here. sqlalchemy lives in that extra, and `mypy app` cannot
      # type-check app/core/health.py without it — it fails with import-not-found. Installing the
      # extra means mypy checks against the real sqlalchemy stubs rather than being told to ignore
      # the module, which would blind it to every database call in the codebase.
      # Upgrade the build tooling BEFORE installing and auditing. pip-audit scans the whole
      # environment, and the setuptools a runner ships can carry known CVEs that have nothing to do
      # with our dependency graph — that is exactly what happened on the first run of this workflow
      # (7 advisories against setuptools 66.1.1). Upgrading fixes it honestly; `--ignore-vuln` would
      # suppress a real finding in the build environment and every future one with it.
      - name: Upgrade build tooling
        run: pip install --upgrade pip setuptools wheel

      - name: Install (dev + db extras)
        run: pip install -e '.[dev,db]'

      - name: Lint
        run: ruff check .

      # Formatting is checked, not applied: a commit that is unformatted is a review defect, and
      # letting CI reformat silently would hide it.
      - name: Format check
        run: ruff format --check .

      - name: Type check (strict)
        run: mypy app tests

      # Coverage floor (80%) is configured in pyproject.toml, so it is enforced here rather than
      # restated as a flag that could drift from the config.
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing

      # The application factory must construct in a bare environment. This catches import-time
      # breakage that pytest would miss, because pytest injects hermetic settings via conftest.
      # No env vars are set, so this also proves the development defaults are self-sufficient
      # (ephemeral secrets generated, warnings logged, no crash).
      - name: Smoke — app factory constructs
        run: python -c "from app.main import create_app; app = create_app(); print('routes:', len(app.routes))"

      # No separate "OpenAPI carries no licence/contact" step: tests/contract/test_system_api.py
      # already asserts it, and a second implementation of the same check in shell would drift from
      # the test. The guarantee (ADR-0008 — the repository is deliberately unlicensed, so a generated
      # schema must not imply a grant) is enforced once, in the suite above.

  # ai_services is a separate distribution with its own dependency graph, so it gets its own job:
  # a failure here is an engine-contract or registry defect, not an API defect, and folding the two
  # suites into one job would hide that difference in the check list — which is the only thing a
  # reviewer reads first.
  #
  # Same build-tooling upgrade as the `test` job, for the same reason: pip-audit scans the whole
  # environment, and the setuptools a runner ships can carry CVEs that have nothing to do with this
  # dependency graph. Upgrading fixes that honestly; --ignore-vuln-id would suppress a real finding.
  ai-services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_services/pyproject.toml

      - name: Upgrade build tooling
        run: pip install --upgrade pip setuptools wheel

      # The `dev` extra is the whole toolchain; ai_services has no runtime dependencies at all
      # (ADR-0021, ADR-0023), and the licence gate in security.yml fails the build if that changes.
      - name: Install (dev extra)
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check engines tests

      - name: Format check
        run: ruff format --check engines tests

      - name: Type check (strict)
        run: mypy engines tests

      - name: Tests
        run: pytest

      # Run from OUTSIDE the package directory, on purpose. `engines` is importable from the current
      # working directory whether or not the distribution installed correctly, so a smoke test run
      # from ai_services/ would pass even for a broken wheel — which is exactly what happened during
      # development, when a hatchling `sources` remap silently made editable installs impossible
      # (pfmoore/editables#20: a path rewrite may remove a prefix but may not change one). From a
      # neutral directory, only a working install can import it.
      - name: Smoke — installed distribution exposes the contract
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "from engines import CONTRACT_VERSION, Engine, EngineRegistry;
          print('installed contract', CONTRACT_VERSION, Engine.__name__, EngineRegistry.__name__)"
