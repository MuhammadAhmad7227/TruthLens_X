name: compose-config
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f infra/compose/docker-compose.yml config
      - run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml config
      - run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.test.yml config
